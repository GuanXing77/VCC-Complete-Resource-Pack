<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPM Resource Source</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonBlue: '#00e5ff',
                        neonPurple: '#a25bff',
                        darkBg: '#080b1a',
                    },
                    fontFamily: {
                        mono: ['Consolas','JetBrains Mono','monospace']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-card {
                background: rgba(16,20,40,0.65);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border:1px solid rgba(0,229,255,0.22);
            }
            .btn-gradient {
                background: linear-gradient(90deg,#00e5ff,#a25bff);
            }
            .text-gradient-title {
                background-clip:text;
                -webkit-background-clip:text;
                color:transparent;
                background-image:linear-gradient(90deg,#00e5ff,#a25bff);
            }
        }
        body{
            overflow-x:hidden;
        }
        #particles-js{
            position:fixed;
            z-index:-1;
            width:100%;
            height:100%;
            top:0;
            left:0;
            background:#080b1a;
        }
        /* 悬浮图标发光 */
        .cube-glow{
            box-shadow: 0 0 24px #00e5ff, 0 0 40px #00e5ff44;
        }
        /* Toast 默认隐藏！！修复bug */
        .copy-toast{
            opacity:0;
            transition: all 280ms ease;
            pointer-events:none;
        }
        .copy-toast.show{
            opacity:1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 font-mono text-slate‑100">
    <div id="particles-js"></div>

    <div class="glass-card w-full max-w‑2xl rounded‑3xl p‑10">
        <!-- 顶部发光立方体图标 -->
        <div class="text‑center">
            <div class="w‑20 h‑20 mx‑auto rounded‑full cube‑glow flex items‑center justify‑center bg‑#0c1428">
                <i class="fa fa‑cube text‑4xl text‑neonBlue"></i>
            </div>
            <h1 class="mt‑6 text‑4xl font‑bold text‑gradient‑title">VPM Resource Source</h1>
            <p class="text‑slate‑400 mt‑3 text‑lg">VRChat Creator Companion 第三方资源源</p>
        </div>

        <!-- URL输入框区域 -->
        <div class="relative mt‑8">
            <div class="bg‑black/45 border border‑neonBlue/30 rounded‑xl p‑5">
                <code id="vpmUrlText" class="text‑neonBlue break‑all text‑sm">
https://guanxing77.github.io/VCC‑Complete‑Resource‑Pack/index.json
                </code>
            </div>
            <!-- 复制成功提示，默认隐藏，点击才显示 -->
            <div class="copy‑toast absolute right‑4 top‑1/2 -translate‑y‑1/2 text‑emerald‑400 flex items‑center gap‑1">
                <i class="fa fa‑check"></i>链接已复制到剪贴板
            </div>
        </div>

        <!-- 双按钮 -->
        <div class="grid grid‑cols‑1 md:grid‑cols‑2 gap‑5 mt‑7">
            <button onclick="openVcc()" class="btn‑gradient py‑4 rounded‑xl font‑bold text‑black hover:brightness‑110 transition">
                <i class="fa fa‑plug mr‑2"></i>一键导入VCC
            </button>
            <button onclick="handleCopy()" class="glass‑card py‑4 rounded‑xl hover:border‑neonPurple/60 transition">
                <i class="fa fa‑copy mr‑2"></i>复制源地址
            </button>
        </div>

        <!-- 使用说明 -->
        <div class="mt‑8 pl‑4 border‑l‑2 border‑neonPurple/60">
            <p class="text‑slate‑200 mb‑2"><i class="fa fa‑lightbulb‑o mr‑1"></i> 使用说明</p>
            <p class="text‑slate‑400 text‑sm my‑2">1. 点击一键导入会唤起 VCC / Keiryo</p>
            <p class="text‑slate‑400 text‑sm my‑2">2. 网络不佳请手动复制链接，在VCC添加仓库</p>
            <p class="text‑slate‑400 text‑sm my‑2">3. GitHub Pages部署后约1‑3分钟生效</p>
        </div>
    </div>

<script>
particlesJS("particles-js",{
    particles:{
        number:{value:65,density:{enable:true,value_area:1100}},
        color:{value:["#00e5ff","#a25bff"]},
        shape:{type:"circle"},
        opacity:{value:0.22,random:true},
        size:{value:2,random:true},
        line_linked:{enable:true,distance:150,color:"#00e5ff",opacity:0.1,width:1},
        move:{enable:true,speed:0.65,direction:"none",random:true,out_mode:"out"}
    },
    interactivity:{
        detect_on:"window",
        events:{
            onhover:{enable:true,mode:"grab"}
        },
        modes:{grab:{distance:170,line_linked:{opacity:0.35}}}
    },
    retina_detect:true
});

const VPM_REPO_URL = "https://guanxing77.github.io/VCC-Complete-Resource-Pack/index.json";
const toastDom = document.querySelector(".copy-toast");

// 一键打开VCC协议
function openVcc(){
    window.open(`vcc://vpm/addRepo?url=${encodeURIComponent(VPM_REPO_URL)}`);
}

// 复制函数，点击之后才弹出提示，修复BUG
async function handleCopy(){
    await navigator.clipboard.writeText(VPM_REPO_URL);
    toastDom.classList.add("show");
    setTimeout(()=>{
        toastDom.classList.remove("show");
    },1400);
}
</script>
</body>
</html>
