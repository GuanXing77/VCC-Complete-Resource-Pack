<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCC VPM Resource Source</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonBlue: '#00f0ff',
                        neonPurple: '#b347ff',
                        darkBg: '#050714',
                        glassBg: 'rgba(15, 20, 40, 0.65)'
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono','Consolas','monospace']
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2.5s infinite alternate'
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { boxShadow:'0 0 8px #00f0ff, 0 0 14px #b347ff' },
                            '100%': { boxShadow:'0 0 18px #00f0ff, 0 0 30px #b347ff' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass {
                background: rgba(15, 20, 40, 0.6);
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                border: 1px solid rgba(0,240,255,0.18);
            }
            .text-gradient {
                background-clip:text;
                -webkit-background-clip:text;
                color:transparent;
                background-image:linear-gradient(90deg,#00f0ff,#b347ff);
            }
        }
        body {
            overflow-x:hidden;
        }
        #particles-js {
            position:fixed;
            width:100%;
            height:100%;
            top:0;
            left:0;
            z-index:-1;
            background:#050714;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-mono text-slate-100">
    <div id="particles-js"></div>

    <!-- 主卡片 -->
    <div class="glass w-full max-w-xl rounded-2xl p-8 shadow-lg">
        <div class="text-center mb-8">
            <i class="fa fa-cube text-5xl text-neonBlue mb-4 animate-pulse-glow rounded-full p-2"></i>
            <h1 class="text-[clamp(1.7rem,4vw,2.3rem)] font-bold text-gradient">VPM Resource Source</h1>
            <p class="text-slate-400 mt-3">VRChat Creator Companion 第三方资源源</p>
        </div>

        <!-- VPM链接框 -->
        <div class="bg-black/40 border border-neonBlue/25 rounded-lg px-4 py-3 mb-6 overflow-x-auto">
            <code id="vpmUrl" class="text-neonBlue text-sm break-all">
https://guanxing77.github.io/VCC-Complete-Resource-Pack/index.json
            </code>
        </div>

        <!-- 按钮组 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
            <button onclick="openVcc()"
                class="bg-gradient-to-r from-neonBlue to-neonPurple hover:brightness-110 transition-all rounded-lg py-3.5 font-semibold text-black">
                <i class="fa fa-plug mr-2"></i>一键导入VCC
            </button>
            <button onclick="copyUrl()"
                class="glass hover:border-neonPurple/60 transition-all rounded-lg py-3.5">
                <i class="fa fa-copy mr-2"></i>复制源地址
            </button>
        </div>

        <!-- 使用提示 -->
        <div class="border-l-2 border-neonPurple pl-4 text-sm text-slate‑300 space-y-2 text-slate-400">
            <p>💡 <strong class="text-slate‑200">使用说明</strong></p>
            <p>1. 点击一键导入会唤起 VCC / Keiryo</p>
            <p>2. 网络不佳请手动复制链接，在VCC添加仓库</p>
        </div>
    </div>

  

<script>
//粒子配置
particlesJS("particles-js",{
    particles:{
        number:{value:80,density:{enable:true,value_area:1000}},
        color:{value:["#00f0ff","#b347ff"]},
        shape:{type:"circle"},
        opacity:{value:0.25,random:true},
        size:{value:2.2,random:true},
        line_linked:{enable:true,distance:140,color:"#00f0ff",opacity:0.12,width:1},
        move:{enable:true,speed:0.75,direction:"none",random:true,out_mode:"out"}
    },
    interactivity:{
        detect_on:"window",
        events:{
            onhover:{enable:true,mode:"grab"},
            onclick:{enable:true,mode:"push"}
        },
        modes:{grab:{distance:160,line_linked:{opacity:0.4}}}
    },
    retina_detect:true
});

const vpmLink = "https://guanxing77.github.io/VCC-Complete-Resource-Pack/index.json";

function openVcc(){
    window.open(`vcc://vpm/addRepo?url=${encodeURIComponent(vpmLink)}`);
}

function copyUrl(){
    navigator.clipboard.writeText(vpmLink);
    const toast = document.getElementById("toast");
    toast.classList.add("opacity‑100");
    setTimeout(()=>toast.classList.remove("opacity‑100"),1600);
}
</script>
</body>
</html>
